<svg width="420" height="120" viewBox="0 0 420 120" xmlns="http://www.w3.org/2000/svg">
  <rect width="420" height="120" fill="none"></rect>
  
  <!-- Monitor -->
  <rect x="10" y="25" width="90" height="55" rx="8" stroke="#0B2A4A" stroke-width="5" fill="none"></rect>
  <rect x="45" y="80" width="20" height="8" fill="#0B2A4A"></rect>
  
  <!-- Motion lines -->
  <rect x="0" y="40" width="20" height="5" fill="#00AEEF"></rect>
  <rect x="0" y="50" width="25" height="5" fill="#00AEEF"></rect>
  <rect x="0" y="60" width="18" height="5" fill="#00AEEF"></rect>
  
  <!-- Arrow -->
  <polygon points="70,40 90,52 70,64" fill="#FFC107"></polygon>
  
  <!-- Text -->
  <text x="120" y="60" font-family="Arial, sans-serif" font-size="34" fill="#0B2A4A" font-weight="bold">
    OTIMIZE
  </text>
  <text x="120" y="95" font-family="Arial, sans-serif" font-size="22" fill="#FFC107" letter-spacing="3">
    REMOTE
  </text>
</svg>